<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATHWAYS</title>

<style>
/* =========================
   COLOURS & BASICS
========================= */
:root{
  --bg:#dff4e6;          /* light green background */
  --oak:#4b2e1a;         /* oak brown text */
  --card:#ffffff;

  --news:#ffb3ba;
  --features:#bae1ff;
  --opinion:#cdb4db;
  --sports:#ffd6a5;
  --culture:#baffc9;
  --puzzles:#ffffba;

  --good:#5fd38d;
  --bad:#ff7b7b;

  --shadow:0 10px 25px rgba(0,0,0,.15);
  --radius:18px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--oak);
}

h1,h2,h3{margin:0;color:var(--oak)}
a{text-decoration:none;color:var(--oak)}

/* =========================
   NAV
========================= */
.nav{
  position:sticky;top:0;z-index:10;
  background:#fff;
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
  box-shadow:var(--shadow);
}
.nav h1{letter-spacing:.25em}
.nav a{
  padding:8px 12px;
  border-radius:999px;
  font-weight:700;
}
.nav a:hover{background:#eee}
.search input{
  padding:8px 12px;
  border-radius:12px;
  border:2px solid var(--oak);
}

/* =========================
   LAYOUT
========================= */
.wrap{max-width:900px;margin:auto;padding:20px}
.section{
  margin-top:28px;
  border-radius:var(--radius);
  padding:18px;
}
.section h2{
  letter-spacing:.18em;
  margin-bottom:12px;
}

/* =========================
   ARTICLES
========================= */
.article{
  background:var(--card);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
  position:relative;
}
.article h3{margin-bottom:8px}

.print-btn{
  margin-top:8px;
  padding:6px 12px;
  border-radius:12px;
  border:2px dashed var(--oak);
  background:#fff;
  font-weight:700;
  cursor:pointer;
}

/* Stickman */
.stickman{
  position:absolute;
  right:12px;
  bottom:10px;
  font-size:22px;
}

/* =========================
   PUZZLES
========================= */
.puzzles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
@media(max-width:800px){.puzzles{grid-template-columns:1fr}}

.panel{
  background:#fff;
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow);
}

.sudoku{
  display:grid;
  grid-template-columns:repeat(9,1fr);
}
.cell{
  aspect-ratio:1/1;
  border:1px solid #ccc;
}
.cell input{
  width:100%;height:100%;
  border:0;
  text-align:center;
  font-size:18px;
  font-weight:800;
  color:var(--oak);
}
.correct{background:var(--good)}
.incorrect{background:var(--bad)}

.wordlist{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:8px;
}
.word{padding:4px 8px;border:1px solid var(--oak);border-radius:999px}

.wordsearch{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:4px;
}
.ws-cell{
  aspect-ratio:1/1;
  border:1px solid #aaa;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  cursor:pointer;
}
.ws-cell.good{background:var(--good)}
.ws-cell.bad{background:var(--bad)}

/* =========================
   POPUP
========================= */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}
.popup.show{display:flex}
.popup-box{
  background:#fff;
  padding:30px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.4);
}
.popup-box h2{font-size:36px}

/* =========================
   PRINT
========================= */
@media print{
  body{background:#fff;color:#000}
  .nav,.print-btn,.popup{display:none!important}
  .article{
    box-shadow:none;
    border:1px solid #000;
    column-count:2;
    column-gap:24px;
  }
}
</style>
</head>

<body>

<header class="nav">
  <h1>PATHWAYS</h1>
  <nav>
    <a href="#news">News</a>
    <a href="#features">Features</a>
    <a href="#opinion">Opinion</a>
    <a href="#sports">Sports</a>
    <a href="#culture">Culture</a>
    <a href="#puzzles">Puzzles</a>
  </nav>
  <div class="search">
    <input id="searchInput" placeholder="Search…">
  </div>
</header>

<div class="wrap">

<section id="news" class="section" style="background:var(--news)">
<h2>NEWS</h2>
<div class="article"><h3>Coming soon</h3><button class="print-btn" onclick="printArticle(this)">Print</button><div class="stickman">🧍</div></div>
<div class="article"><h3>Coming soon</h3><button class="print-btn" onclick="printArticle(this)">Print</button><div class="stickman">🧍‍♂️</div></div>
<div class="article"><h3>Coming soon</h3><button class="print-btn" onclick="printArticle(this)">Print</button><div class="stickman">🧍‍♀️</div></div>
</section>

<section id="features" class="section" style="background:var(--features)">
<h2>FEATURES</h2>
<div class="article"><h3>Coming soon</h3><button class="print-btn" onclick="printArticle(this)">Print</button><div class="stickman">🤸</div></div>
<div class="article"><h3>Coming soon</h3><button class="print-btn" onclick="printArticle(this)">Print</button><div class="stickman">🧑‍💻</div></div>
<div class="article"><h3>Coming soon</h3><button class="print-btn" onclick="printArticle(this)">Print</button><div class="stickman">🕺</div></div>
</section>

<section id="puzzles" class="section" style="background:var(--puzzles)">
<h2>PUZZLES</h2>

<div class="puzzles">
<div class="panel">
<h3>Sudoku</h3>
<div class="sudoku" id="sudoku"></div>
</div>

<div class="panel">
<h3>Wordsearch</h3>
<div class="wordlist" id="wordList"></div>
<div class="wordsearch" id="wordsearch"></div>
</div>
</div>
</section>

</div>

<div class="popup" id="popup">
  <div class="popup-box">
    <h2>WELL DONE! 🎉</h2>
    <p>You smashed it.</p>
  </div>
</div>

<script>
/* =========================
   PRINT ONE ARTICLE
========================= */
function printArticle(btn){
  const article = btn.closest('.article');
  const win = window.open('', '', 'width=800,height=600');
  win.document.write('<html><head><title>Print</title></head><body>'+article.innerHTML+'</body></html>');
  win.document.close();
  win.focus();
  win.print();
  win.close();
}

/* =========================
   DAILY SEED
========================= */
const seed = new Date().toISOString().slice(0,10);

/* =========================
   SUDOKU
========================= */
const puzzle=[[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]];
const solution=[[5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],[8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],[9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]];

const sudokuEl=document.getElementById("sudoku");
let solved=false;
puzzle.forEach((r,i)=>r.forEach((v,j)=>{
  const c=document.createElement("div");c.className="cell";
  const inp=document.createElement("input");
  if(v){inp.value=v;inp.disabled=true}
  else{
    inp.oninput=()=>{
      c.classList.remove("correct","incorrect");
      if(+inp.value===solution[i][j])c.classList.add("correct");
      else c.classList.add("incorrect");
      checkSudoku();
    }
  }
  c.appendChild(inp);sudokuEl.appendChild(c);
}));
function checkSudoku(){
  if(solved)return;
  const inputs=[...sudokuEl.querySelectorAll("input")];
  if(inputs.every((i,k)=>+i.value===solution[Math.floor(k/9)][k%9])){
    solved=true;
    showPopup();
  }
}

/* =========================
   WORDSEARCH
========================= */
const words=["PATH","OAK","TREE","ROOT"];
const wl=document.getElementById("wordList");
const ws=document.getElementById("wordsearch");
words.forEach(w=>{const s=document.createElement("span");s.className="word";s.textContent=w;wl.appendChild(s)});
const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let goodCount=0;
for(let i=0;i<100;i++){
  const d=document.createElement("div");
  d.className="ws-cell";
  d.textContent=letters[Math.floor(Math.random()*26)];
  d.onclick=()=>{
    d.classList.toggle("good");
    goodCount++;
    if(goodCount>15)showPopup();
  };
  ws.appendChild(d);
}

/* =========================
   POPUP
========================= */
function showPopup(){
  const p=document.getElementById("popup");
  p.classList.add("show");
  setTimeout(()=>p.classList.remove("show"),2000);
}
</script>

</body>
</html>
