<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PATHWAYS</title>

<style>
:root{
  --bg0:#070c08;
  --bg1:#0b120d;
  --bg2:#101812;

  --bark:#3a2314;

  --text:#eef7ee;
  --muted:#cfe3d2;

  --shadow:0 18px 45px rgba(0,0,0,.55);
  --radius:22px;

  --good:#3ddc84;
  --goodB:#2ea96a;
  --bad:#ff6b6b;
  --badB:#cc5252;

  /* VIVID SECTION ACCENTS */
  --news:#4fc3f7;
  --features:#ffb74d;
  --opinion:#b388ff;
  --sports:#ff5252;
  --culture:#ff80ab;
  --puzzles:#69f0ae;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 700px at 15% 10%, rgba(255,255,255,.08), transparent 60%),
    linear-gradient(180deg,var(--bg0),var(--bg1) 40%,var(--bg2));
}

.wrap{max-width:980px;margin:auto;padding:20px;position:relative;z-index:1}

/* NAV */
.nav{
  position:sticky;top:12px;z-index:10;
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:14px 18px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(10px);
  border-radius:20px;
  box-shadow:var(--shadow);
}
.nav h1{
  margin:0;font-size:16px;letter-spacing:.22em;
}
.nav a{
  color:var(--muted);
  text-decoration:none;
  padding:8px 12px;
  border-radius:999px;
  font-weight:700;
}
.nav a:hover{background:rgba(255,255,255,.1)}

.search input{
  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.2);
  border-radius:14px;
  padding:8px 12px;
  color:var(--text);
}

/* HERO */
.hero{
  margin-top:18px;
  padding:26px;
  border-radius:26px;
  background:rgba(0,0,0,.45);
  box-shadow:var(--shadow);
}
.title{
  font-size:46px;
  letter-spacing:.25em;
  margin:0;
  position:relative;
  display:inline-block;
}
.title::after{
  content:"";
  position:absolute;
  left:0;bottom:-6px;
  width:100%;height:10px;
  background:var(--bark);
  border-radius:999px;
}

/* SECTIONS */
.section{
  margin-top:24px;
  border-radius:26px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.section-h{
  padding:16px 18px;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
  background:rgba(0,0,0,.35);
}
.section-b{padding:18px}

/* SECTION COLOURS */
#news{background:var(--news)}
#features{background:var(--features)}
#opinion{background:var(--opinion)}
#sports{background:var(--sports)}
#culture{background:var(--culture)}
#puzzles{background:var(--puzzles)}

/* ARTICLES */
.layout{
  display:grid;
  grid-template-columns:1.35fr .65fr;
  gap:16px;
}
@media(max-width:820px){.layout{grid-template-columns:1fr}}

.lead,.stack{display:grid;gap:16px}

.card{
  background:#111;
  border-radius:22px;
  padding:20px;
  min-height:130px;
  position:relative;
}
.card h3{
  margin:0 0 12px 0;
  text-transform:uppercase;
  letter-spacing:.06em;
}

/* PRINT BUTTON */
.print-btn{
  margin-top:10px;
  padding:8px 14px;
  border-radius:14px;
  border:1px dashed rgba(255,255,255,.4);
  background:rgba(0,0,0,.3);
  color:var(--text);
  font-weight:700;
  cursor:pointer;
}
.print-btn:hover{background:rgba(255,255,255,.12)}

/* PUZZLES */
.puzzles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
@media(max-width:900px){.puzzles{grid-template-columns:1fr}}

.panel{
  background:#111;
  border-radius:22px;
  padding:16px;
}

.sudoku{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  border:2px solid rgba(255,255,255,.3);
}
.cell{
  aspect-ratio:1/1;
  border:1px solid rgba(255,255,255,.2);
}
.cell input{
  width:100%;height:100%;
  text-align:center;
  font-size:18px;
  font-weight:900;
  background:none;
  border:none;
  color:var(--text);
}
.correct{background:var(--good)}
.incorrect{background:var(--bad)}

.wordlist{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:10px;
}
.word{
  padding:6px 10px;
  background:rgba(255,255,255,.1);
  border-radius:999px;
  font-weight:800;
}

.wordsearch{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:4px;
}
.ws-cell{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.2);
}
.ws-cell.good{background:var(--good)}
.ws-cell.bad{background:var(--bad)}

footer{
  margin-top:24px;
  text-align:center;
  opacity:.7;
  letter-spacing:.1em;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.8);
  padding:12px 16px;
  border-radius:18px;
  opacity:0;
  transition:.2s;
}
.toast.show{opacity:1}

/* PRINT MODE */
@media print{
  body{background:#fff;color:#000}
  .nav,.print-btn,.toast{display:none!important}
  .section{background:#fff!important;box-shadow:none}
  .card{
    background:#fff;
    color:#000;
    column-count:2;
    column-gap:24px;
    border:1px solid #000;
  }
}
</style>
</head>

<body>
<div class="wrap">

<header class="nav">
  <h1>PATHWAYS</h1>
  <nav>
    <a href="#news">News</a>
    <a href="#features">Features</a>
    <a href="#opinion">Opinion</a>
    <a href="#sports">Sports</a>
    <a href="#culture">Culture</a>
    <a href="#puzzles">Puzzles</a>
  </nav>
  <div class="search">
    <input id="searchInput" placeholder="Search…" />
  </div>
</header>

<section class="hero">
  <h2 class="title">PATHWAYS</h2>
</section>

<main>

<section id="news" class="section">
  <div class="section-h">News</div>
  <div class="section-b">
    <div class="layout">
      <div class="lead">
        <article class="card article" data-title="coming soon">
          <h3>Coming soon</h3>
          <button class="print-btn" onclick="window.print()">Print</button>
        </article>
      </div>
      <div class="stack">
        <article class="card article" data-title="coming soon"><h3>Coming soon</h3><button class="print-btn" onclick="window.print()">Print</button></article>
        <article class="card article" data-title="coming soon"><h3>Coming soon</h3><button class="print-btn" onclick="window.print()">Print</button></article>
      </div>
    </div>
  </div>
</section>

<section id="puzzles" class="section">
  <div class="section-h">Puzzles</div>
  <div class="section-b">
    <div class="puzzles">

      <div class="panel">
        <h3>Sudoku</h3>
        <div class="sudoku" id="sudoku"></div>
      </div>

      <div class="panel">
        <h3>Wordsearch</h3>
        <div class="wordlist" id="wordList"></div>
        <div class="wordsearch" id="wordsearch"></div>
      </div>

    </div>
  </div>
</section>

</main>

<footer>PATHWAYS</footer>
</div>

<div class="toast" id="toast"><b>Well done!</b></div>

<script>
/* ========= DAILY KEY ========= */
const today=new Date().toISOString().slice(0,10);
const daily=(k,d)=>JSON.parse(localStorage.getItem(k)||`{"date":"${today}","value":${JSON.stringify(d)}}`);
const setDaily=(k,v)=>localStorage.setItem(k,JSON.stringify({date:today,value:v}));

/* ========= TOAST ========= */
const toast=document.getElementById("toast");
function showToast(t="Well done!"){
  toast.innerHTML="<b>"+t+"</b>";
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1600);
}

/* ========= SUDOKU ========= */
const puzzle=[[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]];
const sol=[[5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],[8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],[9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]];
const sudoku=document.getElementById("sudoku");
let state=daily("sdk",Array.from({length:9},()=>Array(9).fill(0))).value;
puzzle.forEach((r,i)=>r.forEach((v,j)=>{
  const c=document.createElement("div");c.className="cell";
  const inp=document.createElement("input");
  if(v){inp.value=v;inp.disabled=true}
  else{
    inp.value=state[i][j]||"";
    inp.oninput=()=>{
      state[i][j]=+inp.value||0;
      setDaily("sdk",state);
      c.classList.toggle("correct",state[i][j]===sol[i][j]);
      c.classList.toggle("incorrect",state[i][j]&&state[i][j]!==sol[i][j]);
      if(state.flat().every((x,k)=>x===sol[Math.floor(k/9)][k%9]))showToast("Sudoku complete!");
    };
  }
  c.appendChild(inp);sudoku.appendChild(c);
}));

/* ========= WORDSEARCH ========= */
const words=["PATHWAYS","ROOT","LEAF","BARK","OAK","PINE","CAMPUS"];
const ws=document.getElementById("wordsearch");
const wl=document.getElementById("wordList");
words.forEach(w=>{const s=document.createElement("span");s.className="word";s.textContent=w;wl.appendChild(s)});
const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let found=new Set(daily("ws",[]).value);
for(let i=0;i<144;i++){
  const d=document.createElement("div");
  d.className="ws-cell";
  d.textContent=letters[Math.floor(Math.random()*26)];
  if(found.has(i))d.classList.add("good");
  d.onclick=()=>{
    d.classList.toggle("good");
    if(d.classList.contains("good"))found.add(i);else found.delete(i);
    setDaily("ws",[...found]);
    if(found.size>20)showToast("Wordsearch complete!");
  };
  ws.appendChild(d);
}
</script>
</body>
</html>
